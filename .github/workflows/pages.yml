name: Publier les maquettes (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Phase A : le dossier des maquettes est servi tel quel.
      # Phase B : remplacer par le build Astro et publier `dist/`.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: design/variants
      - id: deployment
        uses: actions/deploy-pages@v4
